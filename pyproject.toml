[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lecture-notes"
version = "0.1.0"
description = "Transcribe lectures locally with mlx-whisper and turn them into structured Word study notes using an LLM (macOS)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "kacpero101" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=1.13,<2",
    "keyring>=25",
    "mlx-whisper>=0.4.3",
    "python-docx>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lecture-notes = "lecture_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_notes"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "lecture_notes/config.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test that runs real mlx-whisper on a synthetic recording (slow; run with -m e2e)",
]
